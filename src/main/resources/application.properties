spring.application.name=datashare-backend

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.open-in-view=false


spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1025MB

aws.s3.bucket=${AWS_S3_BUCKET:datashare-stockage-2026}
aws.region=${AWS_REGION:eu-north-1}

app.base-url=${APP_BASE_URL:http://localhost:8080}

aws.credentials.access-key=${AWS_ACCESS_KEY_ID}
aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY}