services:
  postgres:
    image: postgres:16
    container_name: datashare-postgres
    environment:
      POSTGRES_DB: datashare
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - datashare_pgdata:/var/lib/postgresql/data

volumes:
  datashare_pgdata: